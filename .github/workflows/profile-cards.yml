name: Generate GitHub Profile Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Generate profile analytics
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: AyanokojiKiyotaka2010
          cards: overview,lifetime,contributions,composition,rhythm,languages
          output-dir: assets/profile
          themes: light,dark
          commit: true
          commit-message: "chore(profile): update GitHub analytics [skip ci]"
